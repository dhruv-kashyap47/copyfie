[workspace]
resolver = "2"
members = [
    "src-tauri",
    "crates/copyfie-core",
    "platform/common",
    "platform/windows",
    "platform/macos",
    "platform/linux",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
publish = false

# Release profile per PLAN.md §8. Applies to shipping binaries only; never to
# `cargo test`/`clippy`.
[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# Search/store hot paths keep full optimization even though the rest of the
# binary favors size.
[profile.release.package.copyfie-core]
opt-level = 3

# Optimized, non-LTO profile for benchmarks and the perf harness. Keeps
# iteration fast while matching the runtime optimization level.
[profile.bench]
inherits = "release"
lto = false
codegen-units = 16
