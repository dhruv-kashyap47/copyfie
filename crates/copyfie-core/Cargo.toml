[package]
name = "copyfie-core"
version.workspace = true
edition.workspace = true
publish = false
description = "Copyfie core: models, hashing, SQLite store, search, and retention"

[dependencies]
blake3 = "1.8"
rusqlite = { version = "0.42", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[dev-dependencies]
tempfile = "3"
