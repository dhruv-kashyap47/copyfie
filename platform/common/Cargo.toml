[package]
name = "copyfie-platform"
version.workspace = true
edition.workspace = true
publish = false
description = "Platform traits and shared clipboard types for Copyfie"

[features]
# Enables the shared `clipboard-rs` adapter used by the desktop backends.
system-clipboard = ["dep:clipboard-rs"]

[dependencies]
clipboard-rs = { version = "0.3.5", default-features = false, optional = true }
copyfie-core = { path = "../../crates/copyfie-core", version = "0.1.0" }
thiserror = "2"
