[package]
name = "copyfie-platform-macos"
version.workspace = true
edition.workspace = true
publish = false
description = "macOS clipboard, foreground-app, and concealed-marker backend for Copyfie"

[dependencies]
copyfie-core = { path = "../../crates/copyfie-core", version = "0.1.0" }
copyfie-platform = { path = "../common", version = "0.1.0", features = ["system-clipboard"] }
thiserror = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = [
  "std",
  "NSRunningApplication",
  "NSWorkspace",
] }
objc2-foundation = { version = "0.3", default-features = false, features = [
  "std",
  "NSString",
] }
