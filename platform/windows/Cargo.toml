[package]
name = "copyfie-platform-windows"
version.workspace = true
edition.workspace = true
publish = false
description = "Windows clipboard, foreground-app, and concealed-marker backend for Copyfie"

[dependencies]
copyfie-core = { path = "../../crates/copyfie-core", version = "0.1.0" }
copyfie-platform = { path = "../common", version = "0.1.0", features = ["system-clipboard"] }
thiserror = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }
