# cargo-deny policy for Copyfie (proprietary, closed-source product).
#
# Run from the repository root:
#   cargo deny --config scripts/license/cargo-deny.toml check
#
# Policy rationale: THIRD_PARTY.md §4. A proprietary binary cannot ship GPL,
# AGPL, SSPL, BUSL, Commons Clause, or non-commercial code. MPL-2.0 is allowed
# for unmodified dependencies only (file-level copyleft); we never copy MPL
# code into our sources.

[graph]
# Check the dependency graph for all supported targets. CI runs this on Linux,
# so cross-platform crates must be audited even when the host is not Windows or
# macOS.
all-features = false

[advisories]
# Fail on advisories that affect runtime code; unmaintained/yanked crates warn.
unmaintained = "workspace"
ignore = []

[licenses]
confidence-threshold = 0.9
unused-allowed-license = "warn"
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unlicense",
  "Unicode-3.0",
  "MPL-2.0",
]

# Workspace crates are proprietary and unpublished, so they carry no SPDX
# license field until the LICENSE/EULA release gate (M2-01).
[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# GPL-family and non-commercial crates are rejected by the license check above.
# List crates here only when they must never be reintroduced for another reason
# (e.g. a duplicate runtime, a banned native dependency).
deny = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
