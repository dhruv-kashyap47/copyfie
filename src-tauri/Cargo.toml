[package]
name = "copyfie"
version.workspace = true
edition.workspace = true
publish = false
description = "Copyfie clipboard history"
default-run = "copyfie"

[lib]
name = "copyfie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
copyfie-core = { path = "../crates/copyfie-core", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
