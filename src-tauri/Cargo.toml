[package]
name = "copyfie"
version.workspace = true
edition.workspace = true
publish = false
description = "Copyfie clipboard history"
default-run = "copyfie"

[lib]
name = "copyfie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
copyfie-core = { path = "../crates/copyfie-core", version = "0.1.0" }
copyfie-platform = { path = "../platform/common", version = "0.1.0" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-log = "2"
thiserror = "2"
tokio = { version = "1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
copyfie-platform-windows = { path = "../platform/windows", version = "0.1.0" }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
copyfie-platform-macos = { path = "../platform/macos", version = "0.1.0" }

[target.'cfg(target_os = "linux")'.dependencies]
copyfie-platform-linux = { path = "../platform/linux", version = "0.1.0" }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
